[project]
name = "trame-revealjs"
version = "0.0.1"
description = "trame-revealjs library"
authors = [
    { name = "Kitware Inc."},
]
dependencies = [
    "trame",
    "trame-vuetify",
]

requires-python = ">=3.10"
readme = "README.md"
license = { text = "Apache 2.0 License" }
keywords = [
    "Python",
    "Interactive",
    "Web",
    "Application",
    "Framework",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/trame_revealjs",
]

[tool.hatch.metadata]
allow-direct-references = true

build_command = """
  python -m venv .venv
  source .venv/bin/activate
  pip install -U pip build
  python -m build .
"""
